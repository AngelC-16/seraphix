<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Opciones de animación · Seraphix</title>
  <link rel="preload" href="../../assets/fuentes/unbounded-1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/fuentes.css">
  <link rel="stylesheet" href="opciones.css">
</head>
<body>
  <header class="cab">
    <p class="cab__eyebrow">Seraphix · prueba interna</p>
    <h1 class="cab__titulo">Animación del inicio: elige una</h1>
    <div class="pestanas" role="tablist" aria-label="Opciones de animación">
      <button role="tab" data-op="0">1</button>
      <button role="tab" data-op="1">2</button>
      <button role="tab" data-op="2">3</button>
      <button role="tab" data-op="3">4</button>
      <button role="tab" data-op="4">5</button>
    </div>
  </header>

  <main class="panel" role="tabpanel">
    <h2 class="panel__titulo" id="op-titulo">Opción</h2>
    <p class="panel__desc" id="op-desc"></p>
    <div class="escenario" id="escenario"></div>
    <button class="repetir" id="repetir" type="button">↻ Repetir</button>
  </main>

  <p class="nota">Página de prueba, sin publicar en Google. La animación actual (partículas) está en <a href="../">/v2</a>.</p>

  <script src="../logo-trazos.js"></script>
  <script src="opciones.js"></script>
</body>
</html>
